services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb
    ports:
      - "27017:27017"
    networks:
      - app-network

  product-api:
    image: your-dockerhub-username/product-api:latest
    container_name: product-api-prod
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://nammongodb:27017/product_db
    depends_on:
      - mongodb
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
